# Browsable copy of the archived eras, rebuilt from mirror/ on every push.
[build]
  command = "python3 scripts/build_site.py"
  publish = "site"

# Keep the archive out of search engines: it duplicates old public content.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
