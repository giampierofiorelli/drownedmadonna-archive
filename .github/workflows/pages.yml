name: Publish archive site

# Rebuilds the browsable copy on GitHub Pages whenever downloaded files or the
# builder change. Requires Settings > Pages > Source = "GitHub Actions".
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - mirror/**
      - scripts/build_site.py
      - scripts/urlkeys.py
      - scripts/exclusives.py
      - scripts/promo.py
      - scripts/year_news.py
      - .github/workflows/pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build site
        run: python scripts/build_site.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
