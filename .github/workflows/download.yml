name: Wayback download

# Downloads the eras listed in config/download.json, one after another.
# Each run works for up to ~5h20m on the first incomplete era, commits progress,
# then re-dispatches itself until every era is complete.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - config/download.json

permissions:
  contents: write
  actions: write

concurrency:
  group: download
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pick era
        id: cfg
        run: python scripts/next_era.py

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Download era
        id: dl
        if: steps.cfg.outputs.done == 'false'
        env:
          ERA_LABEL: ${{ steps.cfg.outputs.era }}
          CAPTURE_FROM: ${{ steps.cfg.outputs.from }}
          CAPTURE_TO: ${{ steps.cfg.outputs.to }}
          ERA_MODE: ${{ steps.cfg.outputs.mode }}
          TIME_BUDGET_MIN: "320"
          GH_TOKEN: ${{ github.token }}
        run: python scripts/download.py

      - name: Commit progress
        if: always()
        run: |
          git add mirror/
          if git diff --cached --quiet; then
            echo "Nothing new to commit"
          else
            git commit -q -m "Wayback download: ${{ steps.cfg.outputs.era }} progress"
            git pull --rebase -q
            git push -q
          fi

      # Bot pushes do not trigger the Pages workflow, so request it explicitly.
      - name: Republish site
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

      - name: Check remaining eras
        id: next
        if: always()
        run: python scripts/next_era.py

      - name: Continue in a new run
        if: ${{ !cancelled() && steps.next.outputs.done == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run download.yml --ref main
