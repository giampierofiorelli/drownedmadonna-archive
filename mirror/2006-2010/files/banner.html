<script language="JavaScript1.2">

<!--Script by Billy Pete (http://members.xoom.com/billypete/) -->
<!--Idea based on scroller found at http://dynamicdrive.com -->

//Specify the marquee's scroll speed (larger is faster)
var speed=6
//Specify the marquee contents
var marqueecontents='<span class="Stile1"><font face="Arial">Provisional Tour Setlist and Sections details exclusively revealed by DrownedMadonna - Madonna to play at Coachella Festival on 30 April - Madonna 12th UK Number 1 with Sorry - Madonna to start tour rehearsals 1 March - Madonna won 1 NME award - Madonna won 1 Brits award - DrownedMadonna Exclusive details on Sorry Video - Madonna opened the Grammys with the Gorillaz - Madonna won 1 NRJ Music Award - Documentary posponed to April</font></span>'

if (document.all)
document.write('<marquee scrollAmount='+speed+' style="width:300">'+marqueecontents+'</marquee>')

function intializemarquee(){
if (document.layers){
document.cmarquee01.document.cmarquee02.document.write('<nobr>'+marqueecontents+'</nobr>')
document.cmarquee01.document.cmarquee02.document.close()
thelength=document.cmarquee01.document.cmarquee02.document.width
scrollit()
}
}

function scrollit(){
if (document.cmarquee01.document.cmarquee02.left>=thelength*(-1)){
document.cmarquee01.document.cmarquee02.left-=speed
setTimeout("scrollit()",100)
}
else{
document.cmarquee01.document.cmarquee02.left=300
scrollit()
}
}

window.onload=intializemarquee
</script>


<ilayer width=300 height=20 name="cmarquee01">
<layer name="cmarquee02"></layer>
</ilayer> 


</head>
