<script language=javascript>

if ( parent.top.HideStatusWindows )
  parent.top.HideStatusWindows();

var bw = new checkBrowser(); // Browser Detection

if(document.layers) 
	document.captureEvents(Event.KEYDOWN);
document.onkeydown = kPress;
var submitCommand = '';



function kPress(e)
{
  if ( bw.ns || bw.ns6)
  {
    if( e.which == 13 && submitCommand != '')
    {
      eval(submitCommand);
      e.which = -1;    
      return false;
    }
  }
  else if ( bw.ie || document.all )
  {
    if ( event.keyCode == 13  && submitCommand != '' )
    {
      eval(submitCommand);
        event.keyCode = -1;
      return false;
    }
  }
     
  return true;
};

if(window.parent.frames['Report'])
  window.parent.frames['Report'].focus();

var focusException = '';
function FocusForm()
  {
    if(document.forms[0])
      {
        if(focusException != '')
          {
            eval('document.forms[0].'+focusException+'.focus();');
          }
        else
          {
            var x = 0;
            var fel = document.forms[0];
    
            while(fel.elements[x])
              {
                if((fel.elements[x].type == 'text' || fel.elements[x].type == 'textarea' || fel.elements[x].type == 'select-one') && !fel.elements[x].isDisabled &&  !fel.elements[x].readOnly)
                  {
                    fel.elements[x].focus();
                    break;
                  }
                x++;
              }
          }
      }
  }
function DoPostBack(action, extraparams, cleanURL)
{  
    //if ( cleanURL == 'undefined' )
    if ( cleanURL )
      cleanURL = true
    var FormAction;
    if(document.forms[0].action.indexOf('#') != -1)
      FormAction = document.forms[0].action.substr(0, document.forms[0].action.indexOf('#'));
    else
      FormAction = document.forms[0].action;
    if ( cleanURL == true )
      if(document.forms[0].action.indexOf('?') != -1)
        FormAction = document.forms[0].action.substr(0, document.forms[0].action.indexOf('?'));
    if ( FormAction.indexOf("?") < 0 )
      FormAction += "?";
    if (FormAction.lastIndexOf("&") != ( FormAction.length - 1 ) )
      FormAction += "&";
    FormAction = FormAction.replace(/Action\=[^\?\&]*/g, '');
    FormAction = FormAction.replace(/\&\&/g, '&');
    FormAction = FormAction.replace(/\?\&/g, '?');
    FormAction += "Action=" + action;

    //if ( extraparams != undefined )
    if ( extraparams )
    { 
      if ( extraparams != '' )
      {
        var extraCGI = extraparams.substr(0,extraparams.indexOf("="));
      
        var rgx = eval("/" + extraCGI + "\=[^\?\&]*/g");
        FormAction = FormAction.replace(rgx, '');
        FormAction = FormAction.replace(/\&\&/g, '&');
        FormAction = FormAction.replace(/\?\&/g, '?');
        FormAction +=  "&" + extraparams;
      }
    }
    document.forms[0].action = FormAction;
    document.forms[0].submit();
    return false;
}

function CustomPost(CustomFormAction)
{  
    document.forms[0].action = CustomFormAction;  
    document.forms[0].submit();
    
    return true;
}

function InitReport()
{
  var Report = GetReportFromURL();
  SetHelp( Report );
  
  SetSettings( Report );
  
  if ( parent.top.HideAllFrames )
    parent.top.HideAllFrames();

  
  pageLoaded = true;
}

function SetSettings( Report )
{
  if ( ! parent.top.ReportSettingsFrame )
    return;
  
  if ( ! Report )
    Report = GetReportFromURL();
  var NewURL      = 'ReportSettingsFrame.aspx?Report=' + Report;
  
  var ReportParams = parent.top.ContentFrame.document.location.search;
  if ( ReportParams )
  {
     ReportParams = "&" + ReportParams.substring( 1 );
     NewURL += ReportParams;
  }
  var ExistingURL = parent.top.ReportSettingsFrame.document.location.href;
  //if ( ExistingURL.indexOf( NewURL ) == -1 )
  {
    parent.top.ReportSettingsFrame.document.location = NewURL;
  }
}

function SetHelp( Report )
{
  if ( ! Report )
    Report = GetReportFromURL();
  
  if ( parent.top.SetContextHelp ) 
    parent.top.SetContextHelp( Report );
}

function GetReportFromURL()
{
    var Path = document.location.pathname;
    var Report = Path.substring( Path.indexOf( "Report-" ) + 7, Path.indexOf( ".aspx" ) );
    return Report;
}

</script>
