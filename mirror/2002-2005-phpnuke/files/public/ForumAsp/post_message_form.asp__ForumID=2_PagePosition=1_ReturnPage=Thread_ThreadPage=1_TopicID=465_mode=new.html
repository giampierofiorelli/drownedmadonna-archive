function CheckForm () {
	
	var errorMsg = "";

	
	//Check for a subject
	if (document.frmAddMessage.subject.value==""){
		errorMsg += "\n\tTitolo \t- Inserisci il titolo del Messaggio";
	}

	
	//Check for message
	if (document.frmAddMessage.message.value==""){
		errorMsg += "\n\tMessaggio \t- Devi inserire il messaggio da pubblicare";
	}
	
	//If there is aproblem with the form then display an error
	if (errorMsg != ""){
		msg = "_______________________________________________________________\n\n";
		msg += "Questo modulo non è stato inoltrato perché possiede qualche errore.\n";
		msg += "Correggi tutti gli errori ed invialo nuovamente.\n";
		msg += "_______________________________________________________________\n\n";
		msg += "I seguenti campi devono essere corretti: -\n";
		
		errorMsg += alert(msg + errorMsg + "\n\n");
		return false;
	}
	
	return true;
}

</script>
